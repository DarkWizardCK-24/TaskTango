<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Task Tango logo">
  <defs>
    <linearGradient id="tile" x1="40" y1="0" x2="470" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c70f38" />
      <stop offset="0.52" stop-color="#ff5c47" />
      <stop offset="1" stop-color="#ffa21f" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="check" x1="110" y1="180" x2="450" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf3" />
      <stop offset="1" stop-color="#fff0d2" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#7d0a22" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#tile)" />
  <rect width="512" height="512" rx="118" fill="url(#sheen)" />
  <!-- dancing ribbon trail -->
  <path d="M84 404 C170 462 300 452 398 372" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="20" stroke-linecap="round" />
  <path d="M120 430 C190 464 280 462 340 432" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="12" stroke-linecap="round" />
  <!-- bold check whose stroke flows into a looping ribbon -->
  <g>
    <path d="M330 192 C340 180 346 176 346 172 C376 130 418 84 458 98 C496 112 486 178 440 176 C402 174 398 122 436 110" fill="none" stroke="url(#check)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path
      d="M110 272 L196 358 L346 172"
      fill="none"
      stroke="url(#check)"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
  <!-- spark -->
  <path d="M130 118 L141 146 L169 157 L141 168 L130 196 L119 168 L91 157 L119 146 Z" fill="#fff4d6" />
  <circle cx="198" cy="96" r="7" fill="#fff4d6" fill-opacity="0.85" />
</svg>
